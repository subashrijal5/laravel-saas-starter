services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: autoguide-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - composer-cache:/tmp/composer
    ports:
      - "${APP_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-autoguide}
      DB_USERNAME: ${DB_USERNAME:-autoguide}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: >
      sh -lc "if [ ! -f vendor/autoload.php ]; then composer install; fi && php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.4
    container_name: autoguide-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-autoguide}
      MYSQL_USER: ${DB_USERNAME:-autoguide}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_FORWARD_PORT:-13306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: autoguide-redis
    ports:
      - "${REDIS_FORWARD_PORT:-16379}:6379"
    volumes:
      - redis-data:/data

volumes:
  vendor:
  composer-cache:
  db-data:
  redis-data:
